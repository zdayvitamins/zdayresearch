backend:
  name: turbo-github
  turbo_site_id: 72ab4c85-830e-406d-be75-ed566950ba64
  branch: main

media_folder: "uploads"
public_folder: "/uploads"
publish_mode: editorial_workflow

collections:
  - name: "research_news"
    label: "Research News"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss Z"}
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Research News", "Research 101", "Metabolism", "Mitochondria", "Recovery", "Community"]
      - label: "Evidence Level"
        name: "evidence"
        widget: "select"
        required: false
        options: ["Human Research", "Animal Research", "Cell Research", "Preclinical Research", "General Education"]
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        required: false
        options: ["Tirzepatide", "Retatrutide", "GLP-1", "Sermorelin", "Tesamorelin", "CJC No DAC", "Ipamorelin", "Growth Hormone", "IGF-1", "MOTS-C", "NAD+", "SS-31", "Mitochondria", "Wolverine", "BPC-157", "TB-500", "GHK-Cu", "GLOW", "KLOW", "KPV", "Glutathione", "Melanotan II", "PT-141", "L-Carnitine", "Bacteriostatic Water", "Research Basics"]
      - {label: "Short Summary", name: "excerpt_text", widget: "text", hint: "1–2 sentences shown on the homepage and news feed."}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Post", name: "body", widget: "markdown"}
      - {label: "Research Source / Citation", name: "source_title", widget: "text", required: false}
      - {label: "Source Link", name: "source_url", widget: "string", required: false}
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}

  - name: "customer_feedback"
    label: "Customer Feedback"
    folder: "_data/reviews"
    create: true
    slug: "{{slug}}"
    extension: "yml"
    format: "yaml"
    editor:
      preview: false
    fields:
      - {label: "Customer Name", name: "name", widget: "string", hint: "Use first name and last initial only, for example: Jay F."}
      - {label: "Feedback", name: "feedback", widget: "text"}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Show on Homepage", name: "featured", widget: "boolean", default: true}
